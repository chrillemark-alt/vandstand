name: Hent vandstandsdata
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hent
  cancel-in-progress: false
jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/hent.mjs
      - name: Gem data
        run: |
          git config user.name "vandstand-bot"
          git config user.email "vandstand-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data $(date -u +%Y-%m-%dT%H:00Z)"
          git pull --rebase --quiet || true
          git push
